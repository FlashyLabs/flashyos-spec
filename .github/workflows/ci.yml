name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: The shell is intact (no code here yet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every file a reader is promised is present
        # Explicit even though this job is ubuntu-only: a matrix added later
        # would break it silently, and the rule is about the script, not the
        # runner it happens to be on today.
        shell: bash
        run: |
          set -euo pipefail
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md SUPPORT.md; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          grep -q 'Apache License' LICENSE
          echo "shell intact — this repository carries no source yet, and nothing here pretends otherwise"
